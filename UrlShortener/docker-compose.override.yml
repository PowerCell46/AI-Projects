# Auto-loaded by `docker compose` alongside docker-compose.yml for local dev.
# Swaps Caddy to plain HTTP on :80 (no ACME/nip.io, no SERVER_IP needed) since
# a laptop behind NAT can't satisfy Let's Encrypt's public reachability check.
#
# Do NOT ship this file to the remote server deployment — there, Caddy should
# use the real Caddyfile with SERVER_IP set to the server's public IP.
services:
  caddy:
    volumes:
      - ./Caddyfile.local:/etc/caddy/Caddyfile:ro
