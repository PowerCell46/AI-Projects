spring.application.name=url-shortener-backend

server.port=${SERVER_PORT:8080}

# Actuator on its own port, separate from the public API
management.server.port=${MANAGEMENT_PORT:8090}

# MongoDB - source of truth
spring.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/url_shortener}
spring.data.mongodb.auto-index-creation=true

# Redis - TTL cache on the redirect path only, never authoritative
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}

# Public base URL the returned short link is built from
url-shortener.base-url=${BASE_URL:http://localhost:8080}

# Redirect-cache TTL (Redis-only; Mongo documents never expire)
url-shortener.cache.ttl=${CACHE_TTL:1h}

# Snowflake id generation
url-shortener.snowflake.worker-id=${SNOWFLAKE_WORKER_ID:1}
url-shortener.snowflake.datacenter-id=${SNOWFLAKE_DATACENTER_ID:1}
