services:
  postgres-api-gateway:
    image: postgres:18
    restart: unless-stopped
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER must be set}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_DB: ${POSTGRES_DB:-twitter_api_gateway_db}
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
    volumes:
      - postgres_api_gateway_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB:-twitter_api_gateway_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  postgres-timeline:
    image: postgres:18
    restart: unless-stopped
    ports:
      - "127.0.0.1:5433:5432"
    environment:
      POSTGRES_USER: ${TIMELINE_DATASOURCE_USERNAME:?TIMELINE_DATASOURCE_USERNAME must be set}
      POSTGRES_PASSWORD: ${TIMELINE_DATASOURCE_PASSWORD:?TIMELINE_DATASOURCE_PASSWORD must be set}
      POSTGRES_DB: ${TIMELINE_POSTGRES_DB:-twitter_timeline_service_db}
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
    volumes:
      - postgres_timeline_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${TIMELINE_DATASOURCE_USERNAME} -d ${TIMELINE_POSTGRES_DB:-twitter_timeline_service_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  kafka:
    image: apache/kafka:4.3.1
    restart: unless-stopped
    ports:
      - "127.0.0.1:9094:9094"
    environment:
      CLUSTER_ID: 3nqZ0hYmS5uGx1c8Bv7KtA
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      # PLAINTEXT is for apps on the host (localhost:9094), INTERNAL for apps in the compose network (kafka:9092)
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9094,INTERNAL://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9094,INTERNAL://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,INTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # The image's default heap is 1 GB (-Xmx1G -Xms1G), the whole 1024M limit below; off-heap memory then gets the container killed
      KAFKA_HEAP_OPTS: -Xms512m -Xmx512m
      # The image's default log.dirs is /tmp/kraft-combined-logs, outside the kafka_data volume, so topics and offsets were lost when the container was recreated
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1024M
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9094"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  kafka-ui:
    image: ghcr.io/kafbat/kafka-ui:v1.5.0
    restart: unless-stopped
    ports:
      - "127.0.0.1:7777:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: broker
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
    depends_on:
      kafka:
        condition: service_healthy

  minio:
    image: alpine/minio:RELEASE.2025-10-15T17-29-55Z
    restart: unless-stopped
    user: "0:0"
    command: server /data --console-address ":9001"
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:?MINIO_ACCESS_KEY must be set}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:?MINIO_SECRET_KEY must be set}
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  mongo:
    image: mongo:8.2
    restart: unless-stopped
    # A single-node replica set, because multi-document transactions need one
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "127.0.0.1:27017:27017"
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1024M
    volumes:
      - mongo_data:/data/db
    # Initiates the replica set on the first run, so `docker compose up -d` is enough. Healthy once rs.status().ok is 1
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          mongosh --quiet --eval
          "try { rs.status().ok } catch (e) { rs.initiate({_id: 'rs0', members: [{_id: 0, host: 'localhost:27017'}]}).ok }"
          | grep -q 1
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 10s

  redis:
    image: redis:8.10.2
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD must be set - redis-server treats an empty --requirepass as no password at all}"]
    ports:
      - "127.0.0.1:6379:6379"
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD:?REDIS_PASSWORD must be set}
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 128M
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  mailpit:
    image: axllent/mailpit:v1.31.2
    restart: unless-stopped
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 128M
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

volumes:
  postgres_api_gateway_data:
  postgres_timeline_data:
  kafka_data:
  minio_data:
  mongo_data:
  redis_data:
