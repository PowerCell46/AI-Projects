# What both servers (default.conf and tls.conf) serve; included inside their server block
root /usr/share/nginx/html;

# The tweet route takes up to 21,037,056 bytes (MAX_TWEET_BODY_BYTES in the gateway); the gateway enforces the exact
# cap per route, this only has to stay above the largest one (nginx's default of 1m would break image uploads)
client_max_body_size 21m;

gzip on;
gzip_types text/css text/javascript application/javascript;

# Only /api/ reaches the gateway, so /internal and /actuator on its port are not served through this server.
# The client address is set, not appended to, because this server is the first proxy and a client-sent value is not trusted
location /api/ {
    proxy_pass http://gateway;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# Vite names these files after their content hash, so they never change under the same name
location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
}

# Deep links (/confirm?token=, /users/:name, /tweets/:id) are routed by the SPA, so any other path gets index.html
location / {
    add_header Cache-Control "no-cache";
    try_files $uri /index.html;
}
