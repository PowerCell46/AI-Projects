# Sent with the files nginx serves itself (/assets/, /fonts/ and the pages). nginx does not inherit add_header into a
# location that sets its own, so each of those locations in app.conf includes this file. /api/ is left out: the gateway
# sets its own headers, and these would repeat them.
#
# Scripts are all external, so script-src needs no 'unsafe-inline'. Styles are all external too, except the style
# attributes React sets (style-src-attr). Images may also be blob: URLs, from the previews of a picked file
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; style-src-attr 'unsafe-inline'; img-src 'self' blob:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header Referrer-Policy "same-origin" always;
add_header X-Content-Type-Options "nosniff" always;
# HSTS: browsers honour it only over https and ignore it on the plain-http server, so one line serves both. No
# includeSubDomains or preload, which cannot be taken back once a domain relies on them
add_header Strict-Transport-Security "max-age=31536000" always;
