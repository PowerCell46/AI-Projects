# Production: https on 8443 with the certificate from ./certs (see docker-compose.prod.yml), and http on 8080 only to
# redirect. The ports are above 1024 because the image runs as the unprivileged nginx user; compose publishes them as
# 443 and 80. COOKIE_SECURE=true needs this https
server {
    listen 8080;
    server_name _;
    server_tokens off;

    # For the container healthcheck, which cannot follow the redirect
    location = /healthz {
        return 200 "ok\n";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 8443 ssl;
    http2 on;
    server_name _;
    server_tokens off;

    ssl_certificate /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # The /api/ location sets no add_header of its own, so it inherits this one; the others get HSTS from security-headers.conf
    add_header Strict-Transport-Security "max-age=31536000" always;

    include /etc/nginx/snippets/app.conf;
}
