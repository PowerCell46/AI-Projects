# One origin serves both the SPA and /api: the session cookie is HttpOnly + SameSite=Strict and the gateway has no CORS.
# Loaded next to default.conf, so both the plain-http and the TLS server see the upstream
# `gateway` is the name of both gateway containers in the compose network, so Docker's DNS returns two addresses and
# nginx, which resolves them once at start, balances round robin over them (the default method)
upstream gateway {
    server gateway:8080;
}
