services:
  postgres:
    image: postgres:18
    ports:
      - "5452:5432"
    environment:
      POSTGRES_USER: twitter_e2e
      POSTGRES_PASSWORD: twitter_e2e
      POSTGRES_DB: twitter_e2e
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U twitter_e2e -d twitter_e2e"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  postgres-timeline:
    image: postgres:18
    environment:
      POSTGRES_USER: twitter_e2e
      POSTGRES_PASSWORD: twitter_e2e
      POSTGRES_DB: twitter_timeline_e2e
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U twitter_e2e -d twitter_timeline_e2e"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  mongo:
    image: mongo:8.2
    # A single-node replica set, because the tweet service's multi-document transactions need one
    command: ["--replSet", "rs0", "--bind_ip_all"]
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1024M
    # Initiates the replica set on the first run. Healthy once rs.status().ok is 1
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          mongosh --quiet --eval
          "try { rs.status().ok } catch (e) { rs.initiate({_id: 'rs0', members: [{_id: 0, host: 'localhost:27017'}]}).ok }"
          | grep -q 1
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 10s

  kafka:
    image: apache/kafka:4.3.1
    environment:
      CLUSTER_ID: 7pQx2LmVRfWnKd3aYtB9Hg
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1024M
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  minio:
    image: alpine/minio:RELEASE.2025-10-15T17-29-55Z
    user: "0:0"
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: twitter-e2e
      MINIO_ROOT_PASSWORD: twitter-e2e-secret
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:8.10.2
    command: ["redis-server", "--requirepass", "twitter-e2e-redis-secret"]
    environment:
      REDISCLI_AUTH: twitter-e2e-redis-secret
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 128M
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  mailpit:
    image: axllent/mailpit:v1.31.2
    ports:
      - "127.0.0.1:8125:8025"
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 128M
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  gateway:
    build: ../twitter_api_gateway
    ports:
      - "8180:8080"
    environment:
      DATASOURCE_URL: jdbc:postgresql://postgres:5432/twitter_e2e
      DATASOURCE_USERNAME: twitter_e2e
      DATASOURCE_PASSWORD: twitter_e2e
      JWT_SECRET: e2e-test-only-jwt-secret-not-for-any-real-use-0123456789abcdef
      INTERNAL_API_SECRET: e2e-test-only-internal-secret-not-for-any-real-use-0123456789
      COOKIE_SECURE: "false"
      BCRYPT_STRENGTH: 4
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      MINIO_URL: http://minio:9000
      MINIO_ACCESS_KEY: twitter-e2e
      MINIO_SECRET_KEY: twitter-e2e-secret
      # The confirmation link the tests read out of the outbox points at the e2e frontend.
      CONFIRMATION_LINK_BASE_URL: http://localhost:5273/confirm
      # No cooldown, so a test can resend straight after registering.
      CONFIRMATION_RESEND_COOLDOWN: 0s
      # The confirmation link the tests click is read from the email the mail service sends, so the outbox
      # poller has to run; half a second keeps the wait short.
      OUTBOX_POLL_FIXED_DELAY_MS: 500
      UNCONFIRMED_CLEANUP_CRON: 0 0 4 29 2 *
      TWEET_SERVICE_URL: http://tweet-service:8081
      TIMELINE_SERVICE_URL: http://timeline-service:8083
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1024M
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      minio:
        condition: service_healthy

  mail-service:
    build: ../twitter_mail_service
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      REDIS_HOST: redis
      REDIS_PASSWORD: twitter-e2e-redis-secret
      # The e2e Mailpit takes mail with no auth and no TLS.
      MAIL_HOST: mailpit
      MAIL_PORT: 1025
      MAIL_SMTP_AUTH: "false"
      MAIL_SMTP_STARTTLS: "false"
      MAIL_FROM: twitter-e2e@example.com
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 768M
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8082/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s
    depends_on:
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
      mailpit:
        condition: service_healthy
      gateway:
        condition: service_healthy

  tweet-service:
    build: ../twitter_tweet_service
    environment:
      MONGODB_URI: mongodb://mongo:27017/twitter_tweet_service_e2e?directConnection=true
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      MINIO_URL: http://minio:9000
      MINIO_ACCESS_KEY: twitter-e2e
      MINIO_SECRET_KEY: twitter-e2e-secret
      # The feed shows a tweet once its event has left the outbox, so the poller has to run; half a second
      # keeps the wait short.
      OUTBOX_POLL_FIXED_DELAY_MS: 500
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 768M
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8081/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s
    depends_on:
      mongo:
        condition: service_healthy
      kafka:
        condition: service_healthy
      minio:
        condition: service_healthy

  timeline-service:
    build: ../twitter_timeline_service
    environment:
      TIMELINE_DATASOURCE_URL: jdbc:postgresql://postgres-timeline:5432/twitter_timeline_e2e
      TIMELINE_DATASOURCE_USERNAME: twitter_e2e
      TIMELINE_DATASOURCE_PASSWORD: twitter_e2e
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      GATEWAY_INTERNAL_URL: http://gateway:8080
      TWEET_SERVICE_URL: http://tweet-service:8081
      # The same secret as the gateway's: it guards the gateway's /internal/v1/** endpoints.
      INTERNAL_API_SECRET: e2e-test-only-internal-secret-not-for-any-real-use-0123456789
      # Never fires: 29 February at 04:00, as the gateway's cleanup job.
      FEED_CLEANUP_CRON: 0 0 4 29 2 *
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 768M
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8083/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s
    depends_on:
      postgres-timeline:
        condition: service_healthy
      kafka:
        condition: service_healthy
      gateway:
        condition: service_healthy
      tweet-service:
        condition: service_healthy
