services:
  postgres:
    image: postgres:18
    ports:
      - "5452:5432"
    environment:
      POSTGRES_USER: twitter_e2e
      POSTGRES_PASSWORD: twitter_e2e
      POSTGRES_DB: twitter_e2e
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U twitter_e2e -d twitter_e2e"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  kafka:
    image: apache/kafka:4.3.1
    environment:
      CLUSTER_ID: 7pQx2LmVRfWnKd3aYtB9Hg
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1024M
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  minio:
    image: alpine/minio:RELEASE.2025-10-15T17-29-55Z
    user: "0:0"
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: twitter-e2e
      MINIO_ROOT_PASSWORD: twitter-e2e-secret
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  gateway:
    build: ../twitter_api_gateway
    ports:
      - "8180:8080"
    environment:
      DATASOURCE_URL: jdbc:postgresql://postgres:5432/twitter_e2e
      DATASOURCE_USERNAME: twitter_e2e
      DATASOURCE_PASSWORD: twitter_e2e
      JWT_SECRET: e2e-test-only-jwt-secret-not-for-any-real-use-0123456789abcdef
      COOKIE_SECURE: "false"
      BCRYPT_STRENGTH: 4
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      MINIO_URL: http://minio:9000
      MINIO_ACCESS_KEY: twitter-e2e
      MINIO_SECRET_KEY: twitter-e2e-secret
      # The confirmation link the tests read out of the outbox points at the e2e frontend.
      CONFIRMATION_LINK_BASE_URL: http://localhost:5273/confirm
      # No cooldown, so a test can resend straight after registering.
      CONFIRMATION_RESEND_COOLDOWN: 0s
      # Outbox rows are the tests' only source for the confirmation link; a poll that publishes them would
      # delete them, so the poller waits a day and the cleanup never fires.
      OUTBOX_POLL_FIXED_DELAY_MS: 86400000
      UNCONFIRMED_CLEANUP_CRON: 0 0 4 29 2 *
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1024M
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      minio:
        condition: service_healthy
