# ==============================================================================
# App
# ==============================================================================
spring.application.name=twitter_mail_service
server.port=${SERVER_PORT:8082}

# ==============================================================================
# Kafka: consumer
# ==============================================================================
# Value deserializers are built per topic in the consumer configuration (the gateway sends no type headers)
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9094}
spring.kafka.consumer.group-id=twitter-mail-service
spring.kafka.consumer.auto-offset-reset=earliest
# Matches the topics' partition count
spring.kafka.listener.concurrency=${MAIL_LISTENER_CONCURRENCY:3}

# ==============================================================================
# Kafka: topics
# ==============================================================================
# The main topics are owned by the gateway (same env vars as there); only the DLTs are declared here
app.kafka.user-confirmation-requested.name=${USER_CONFIRMATION_REQUESTED_TOPIC_NAME:user.confirmation-requested}
app.kafka.user-confirmation-requested.dlt-name=${USER_CONFIRMATION_REQUESTED_DLT_NAME:user.confirmation-requested-dlt}
app.kafka.user-confirmation-requested.dlt-partitions=${USER_CONFIRMATION_REQUESTED_DLT_PARTITIONS:3}
app.kafka.user-followed.name=${USER_FOLLOWED_TOPIC_NAME:user.followed}
app.kafka.user-followed.dlt-name=${USER_FOLLOWED_DLT_NAME:user.followed-dlt}
app.kafka.user-followed.dlt-partitions=${USER_FOLLOWED_DLT_PARTITIONS:3}

# ==============================================================================
# Kafka: retry before DLT
# ==============================================================================
# Each wait must stay well under max.poll.interval.ms (5 min). Shrunk in application-test.properties
app.kafka.retry.initial-interval=${KAFKA_RETRY_INITIAL_INTERVAL:2s}
app.kafka.retry.max-interval=${KAFKA_RETRY_MAX_INTERVAL:60s}
app.kafka.retry.max-retries=${KAFKA_RETRY_MAX_RETRIES:8}

# ==============================================================================
# Redis: mail inbox
# ==============================================================================
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
# Required, no default: an empty password would connect unauthenticated
spring.data.redis.password=${REDIS_PASSWORD}
# How long a claim holds the right to send. Longer than the SMTP timeouts, so a hung send never outlives it
app.mail-inbox.claim-ttl=${MAIL_INBOX_CLAIM_TTL:5m}
app.mail-inbox.confirmation-sent-ttl=${CONFIRMATION_MAIL_SENT_TTL:7d}
# One follow email per follower-followee pair per window, however often the pair follows and unfollows
app.mail-inbox.follow-window=${FOLLOW_MAIL_WINDOW:24h}

# ==============================================================================
# Mail: SMTP
# ==============================================================================
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:true}
# Without these, a server that hides STARTTLS makes JavaMail fall back to plaintext (credentials and links
# included), and a certificate for the wrong host is accepted. Required follows enable, so a plaintext SMTP
# (Mailpit) stays possible only by turning STARTTLS off on purpose
spring.mail.properties.mail.smtp.starttls.required=${spring.mail.properties.mail.smtp.starttls.enable}
spring.mail.properties.mail.smtp.ssl.checkserveridentity=true
# JavaMail defaults to infinite; a hung send must never outlive the inbox claim TTL
spring.mail.properties.mail.smtp.connectiontimeout=${MAIL_SMTP_CONNECTION_TIMEOUT_MS:10000}
spring.mail.properties.mail.smtp.timeout=${MAIL_SMTP_TIMEOUT_MS:10000}
spring.mail.properties.mail.smtp.writetimeout=${MAIL_SMTP_WRITE_TIMEOUT_MS:10000}

# ==============================================================================
# Mail: content
# ==============================================================================
# Required, no default. Must be the Gmail account or a verified alias (Gmail rewrites anything else)
app.mail.from=${MAIL_FROM}
app.mail.zone=${MAIL_ZONE:Europe/Sofia}
app.mail.app-base-url=${APP_BASE_URL:http://localhost:5173}

# ==============================================================================
# Actuator
# ==============================================================================
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=always
# SMTP probe is slow and must not gate liveness
management.health.mail.enabled=false

# ==============================================================================
# Logging
# ==============================================================================
# Kafka clients are extremely chatty at INFO (full consumer config dump, coordinator discovery, Metadata
# cluster id). WARN keeps rebalance/coordinator warnings and errors while silencing the startup and
# steady-state noise; the app itself stays at INFO
logging.level.org.apache.kafka=WARN
logging.level.org.springframework.kafka=WARN
logging.level.kafka=WARN
