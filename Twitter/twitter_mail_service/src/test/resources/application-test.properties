# Shrunk from the production 2s->60s/8-retries backoff so a dead-lettered scenario finishes in ~1s rather
# than ~4 minutes. Still 3 retries so classification (permanent vs. transient) is exercised.
app.kafka.retry.initial-interval=100ms
app.kafka.retry.max-interval=200ms
app.kafka.retry.max-retries=3

# Fixed, non-secret sender for the test suite only - real environments must set MAIL_FROM.
app.mail.from=twitter-test@example.com

# Fixed, non-secret credentials so the contexts that leave SMTP auth on (the default) pass the startup check. The
# contexts that send to Mailpit turn auth off and never use them.
spring.mail.username=twitter-test-user
spring.mail.password=twitter-test-password

# Fixed so a MAIL_ZONE in the developer's environment cannot change the rendered expiry.
app.mail.zone=Europe/Sofia

# Fixed so an APP_BASE_URL in the developer's environment cannot change the rendered link.
app.mail.app-base-url=http://localhost:5173

# Same Kafka quieting as main (see application.properties) - keeps suite output readable.
logging.level.org.apache.kafka=WARN
logging.level.org.springframework.kafka=WARN
logging.level.kafka=WARN
