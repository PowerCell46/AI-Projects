# ==============================================================================
# App
# ==============================================================================
spring.application.name=twitter_api_gateway

# ==============================================================================
# Postgres
# ==============================================================================
# Source of truth
spring.datasource.url=${DATASOURCE_URL:jdbc:postgresql://localhost:5432/twitter_api_gateway_db}
spring.datasource.username=${DATASOURCE_USERNAME:__PLACEHOLDER__}
spring.datasource.password=${DATASOURCE_PASSWORD:__PLACEHOLDER__}

# No Flyway - uniqueness/indexes/cascades are declared on the entities themselves. update, never create:
# data must survive a restart
spring.jpa.hibernate.ddl-auto=update

# ==============================================================================
# Security
# ==============================================================================
# JWT signing secret and access-token TTL. No default anywhere - JWT_SECRET must be set in the
# environment or the app refuses to start
app.jwt.secret=${JWT_SECRET}
app.jwt.ttl=${JWT_TTL:1h}

# Secure cookie attribute - false locally (plain HTTP), true in prod
app.cookie.secure=${COOKIE_SECURE:false}

# BCrypt strength - dropped in the test profile so e2e user registration doesn't pay ~250ms/hash
app.security.bcrypt-strength=${BCRYPT_STRENGTH:12}

# Shared secret guarding /internal/v1/** (service-to-service reads), sent in X-Internal-Secret. No default
# anywhere - INTERNAL_API_SECRET must be set, 32+ bytes, or the app refuses to start
app.internal-api.secret=${INTERNAL_API_SECRET}

# ==============================================================================
# Request limits
# ==============================================================================
# Cap on the raw request body, enforced by RequestBodySizeLimitFilter before authentication or JSON
# parsing. 8 KB leaves generous headroom over the largest legitimate body (register: a 254-character
# email plus a 72-character password)
app.request.max-body-bytes=${MAX_REQUEST_BODY_BYTES:8192}

# The two picture-upload routes get their own, larger body cap: the 5 MB file limit plus 64 KB of multipart
# framing. Spring's multipart limits below are derived from these two so the three never drift apart
app.upload.max-file-bytes=${MAX_UPLOAD_FILE_BYTES:5242880}
app.request.max-upload-body-bytes=${MAX_UPLOAD_BODY_BYTES:5308416}
# Tweet creation (POST /api/v1/tweets only) carries up to 4 images of 5 MB each, so it gets its own cap: 4 x 5 MB
# plus 64 KB of multipart framing. The gateway never parses this body - it is streamed to the tweet service
app.request.max-tweet-body-bytes=${MAX_TWEET_BODY_BYTES:21037056}

spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=${app.upload.max-file-bytes}B
spring.servlet.multipart.max-request-size=${app.request.max-upload-body-bytes}B

# ==============================================================================
# Email confirmation
# ==============================================================================
# Lifetime of a confirmation token, and the minimum gap between two emails to the same pending account
app.confirmation.ttl=${CONFIRMATION_TTL:24h}
app.confirmation.resend-cooldown=${CONFIRMATION_RESEND_COOLDOWN:60s}

# Front-end page the emailed link points at; the raw token is appended as ?token=
app.confirmation.link-base-url=${CONFIRMATION_LINK_BASE_URL:http://localhost:5173/confirm}

# ==============================================================================
# Unconfirmed-user cleanup
# ==============================================================================
# Daily job hard-deleting accounts never confirmed within the retention window. The zone is explicit so
# moving the container doesn't move the run
app.users.unconfirmed-cleanup.cron=${UNCONFIRMED_CLEANUP_CRON:0 0 4 * * *}
app.users.unconfirmed-cleanup.zone=${UNCONFIRMED_CLEANUP_ZONE:Europe/Sofia}
app.users.unconfirmed-cleanup.retention=${UNCONFIRMED_CLEANUP_RETENTION:7d}

# ==============================================================================
# Outbox
# ==============================================================================
# Poller draining PENDING outbox rows to Kafka - fixed-delay, not cron, since it's a continuous drain. A
# row hitting max-attempts flips to FAILED and is left for manual inspection, not retried further
app.outbox.poll-fixed-delay-ms=${OUTBOX_POLL_FIXED_DELAY_MS:3000}
app.outbox.batch-size=${OUTBOX_BATCH_SIZE:500}
app.outbox.max-attempts=${OUTBOX_MAX_ATTEMPTS:3}
app.outbox.send-timeout=${OUTBOX_SEND_TIMEOUT:10s}

# ==============================================================================
# Kafka: producer
# ==============================================================================
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9094}

# The outbox stores the event as a JSON string, so the value is a plain String (which also means no type
# headers). all-ack + idempotent so an at-least-once retry never duplicates a partition's offset ordering
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true

# ==============================================================================
# Kafka: topics
# ==============================================================================
app.kafka.user-confirmation-requested.name=${USER_CONFIRMATION_REQUESTED_TOPIC_NAME:user.confirmation-requested}
app.kafka.user-confirmation-requested.partitions=${USER_CONFIRMATION_REQUESTED_TOPIC_PARTITIONS:3}
app.kafka.user-followed.name=${USER_FOLLOWED_TOPIC_NAME:user.followed}
app.kafka.user-followed.partitions=${USER_FOLLOWED_TOPIC_PARTITIONS:3}
app.kafka.user-unfollowed.name=${USER_UNFOLLOWED_TOPIC_NAME:user.unfollowed}
app.kafka.user-unfollowed.partitions=${USER_UNFOLLOWED_TOPIC_PARTITIONS:3}

# ==============================================================================
# MinIO
# ==============================================================================
# One private bucket for all user media, created on startup if missing. The keys have no default - the
# app refuses to start without them
app.minio.url=${MINIO_URL:http://localhost:9000}
app.minio.access-key=${MINIO_ACCESS_KEY}
app.minio.secret-key=${MINIO_SECRET_KEY}
app.minio.bucket=${MINIO_BUCKET:twitter-media}

# ==============================================================================
# Tweet-service routing
# ==============================================================================
# Base URL of twitter_tweet_service; /api/v1/tweets/** is forwarded there with the path unchanged
app.tweet-service.url=${TWEET_SERVICE_URL:http://localhost:8081}

# ==============================================================================
# Timeline-service routing
# ==============================================================================
# Base URL of twitter_timeline_service; /api/v1/feed is forwarded there with the path unchanged. The timeouts
# below apply to it as well
app.timeline-service.url=${TIMELINE_SERVICE_URL:http://localhost:8083}

# Upstream timeouts. Boot's global HTTP client settings, which the gateway proxy picks up - it has no timeout
# keys of its own, so one value covers every route. Connect failures answer 502, read timeouts 504; nothing is
# retried
spring.http.clients.connect-timeout=${UPSTREAM_CONNECT_TIMEOUT:2s}
spring.http.clients.read-timeout=${UPSTREAM_READ_TIMEOUT:10s}

# ==============================================================================
# Logging
# ==============================================================================
# Kafka clients are extremely chatty at INFO (full producer config dump, Metadata cluster id). WARN keeps
# coordinator warnings and errors while silencing the startup/steady-state noise; the app itself stays at INFO
logging.level.org.apache.kafka=WARN
logging.level.org.springframework.kafka=WARN
logging.level.kafka=WARN
