# Fixed, non-secret HS256 key for the test suite only - real environments must set JWT_SECRET.
app.jwt.secret=test-only-jwt-signing-secret-do-not-use-in-prod

# Skip the ~250ms/hash BCrypt cost in e2e registration/login tests.
app.security.bcrypt-strength=4

# Never fire the unconfirmed-user cleanup mid-suite; its tests call the service directly.
app.users.unconfirmed-cleanup.cron=-

# Never let the outbox poller drain rows mid-suite - tests assert on outbox rows right after registering,
# and a live poller could publish and delete them first. Publisher tests call the service directly.
app.outbox.poll-fixed-delay-ms=86400000

# Same Kafka quieting as main (see application.properties) - keeps suite output readable.
logging.level.org.apache.kafka=WARN
logging.level.org.springframework.kafka=WARN
logging.level.kafka=WARN
