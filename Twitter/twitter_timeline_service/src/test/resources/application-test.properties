# Fixed, non-secret key for the test suite only - real environments must set INTERNAL_API_SECRET.
app.internal-api.secret=test-only-internal-api-secret-do-not-use-in-prod

# Short enough that a delayed stub trips it in a second or two rather than five.
spring.http.clients.read-timeout=1s

# Short retries, so a record that is retried then dead-lettered takes about a second, not about two minutes.
app.kafka.retry.initial-interval=100ms
app.kafka.retry.max-interval=200ms
app.kafka.retry.max-retries=3

# Never fire the retention job mid-suite; its tests call it directly. A small batch makes a handful of entries
# span several batches.
app.feed.cleanup.cron=-
app.feed.cleanup.batch-size=5

# Same Kafka quieting as main (see application.properties) - keeps suite output readable.
logging.level.org.apache.kafka=WARN
logging.level.org.springframework.kafka=WARN
logging.level.kafka=WARN
