# ==============================================================================
# App
# ==============================================================================
spring.application.name=twitter_timeline_service
server.port=${SERVER_PORT:8083}

# ==============================================================================
# Postgres
# ==============================================================================
# Its own database in its own container (postgres-timeline in the root docker-compose.yml). The env names are
# prefixed because this service reads the same root .env as the gateway
spring.datasource.url=${TIMELINE_DATASOURCE_URL:jdbc:postgresql://localhost:5433/twitter_timeline_service_db}
spring.datasource.username=${TIMELINE_DATASOURCE_USERNAME:__PLACEHOLDER__}
spring.datasource.password=${TIMELINE_DATASOURCE_PASSWORD:__PLACEHOLDER__}

# No Flyway - indexes and constraints are declared on the entities themselves. update, never create: data
# must survive a restart
spring.jpa.hibernate.ddl-auto=update

# Reads call other services over HTTP; the default (true) would hold a database connection for that whole time
spring.jpa.open-in-view=false

# ==============================================================================
# Request limits
# ==============================================================================
# Cap on the raw request body, enforced by RequestBodySizeLimitFilter before any JSON parsing. 8 KB is far
# above the largest body this service takes
app.request.max-body-bytes=${MAX_REQUEST_BODY_BYTES:8192}

# ==============================================================================
# Downstream services
# ==============================================================================
# The gateway's /internal/v1/** endpoints (follower ids, authors) and the tweet service's batch read. The
# secret has no default anywhere - INTERNAL_API_SECRET must be set, 32+ bytes, or the app refuses to start, and
# it must equal the gateway's. Only the gateway is sent it
app.gateway-internal.url=${GATEWAY_INTERNAL_URL:http://localhost:8080}
app.tweet-service.url=${TWEET_SERVICE_URL:http://localhost:8081}
app.internal-api.secret=${INTERNAL_API_SECRET}

# Timeouts of every downstream call (Boot's global HTTP client settings). The tweet details read makes two calls
# in sequence, so twice (connect + read) must stay under the gateway's 10s read timeout for proxied routes: a slow
# downstream then answers 504 here before the gateway gives up. A connect failure answers 502, a read timeout 504;
# nothing is retried
spring.http.clients.connect-timeout=${TIMELINE_HTTP_CONNECT_TIMEOUT:1s}
spring.http.clients.read-timeout=${TIMELINE_HTTP_READ_TIMEOUT:3s}

# ==============================================================================
# Kafka: consumer
# ==============================================================================
# Value deserializers are built per topic in the consumer configuration (the producers send no type headers)
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9094}
spring.kafka.consumer.group-id=twitter-timeline-service
spring.kafka.consumer.auto-offset-reset=earliest
# Matches the topics' partition count
spring.kafka.listener.concurrency=${TIMELINE_LISTENER_CONCURRENCY:3}

# ==============================================================================
# Kafka: topics
# ==============================================================================
# The main topics are owned by the tweet service and the gateway (same env vars as there); only the DLTs are
# declared here
app.kafka.tweet-created.name=${TWEET_CREATED_TOPIC_NAME:tweet.created}
app.kafka.tweet-created.dlt-name=${TWEET_CREATED_DLT_NAME:tweet.created-dlt}
app.kafka.tweet-created.dlt-partitions=${TWEET_CREATED_DLT_PARTITIONS:3}
app.kafka.tweet-deleted.name=${TWEET_DELETED_TOPIC_NAME:tweet.deleted}
app.kafka.tweet-deleted.dlt-name=${TWEET_DELETED_DLT_NAME:tweet.deleted-dlt}
app.kafka.tweet-deleted.dlt-partitions=${TWEET_DELETED_DLT_PARTITIONS:3}
app.kafka.user-unfollowed.name=${USER_UNFOLLOWED_TOPIC_NAME:user.unfollowed}
app.kafka.user-unfollowed.dlt-name=${USER_UNFOLLOWED_DLT_NAME:user.unfollowed-dlt}
app.kafka.user-unfollowed.dlt-partitions=${USER_UNFOLLOWED_DLT_PARTITIONS:3}
# The mail service owns user.followed-dlt and reads USER_FOLLOWED_DLT_NAME from the same root .env, so this
# service's dead letters go to their own topic, set by its own prefixed names
app.kafka.user-followed.name=${USER_FOLLOWED_TOPIC_NAME:user.followed}
app.kafka.user-followed.dlt-name=${TIMELINE_USER_FOLLOWED_DLT_NAME:user.followed-timeline-dlt}
app.kafka.user-followed.dlt-partitions=${TIMELINE_USER_FOLLOWED_DLT_PARTITIONS:3}

# ==============================================================================
# Kafka: retry before DLT
# ==============================================================================
# Each wait must stay well under max.poll.interval.ms (5 min). Shrunk in application-test.properties
app.kafka.retry.initial-interval=${KAFKA_RETRY_INITIAL_INTERVAL:2s}
app.kafka.retry.max-interval=${KAFKA_RETRY_MAX_INTERVAL:60s}
app.kafka.retry.max-retries=${KAFKA_RETRY_MAX_RETRIES:8}

# ==============================================================================
# Feed retention
# ==============================================================================
# Entries whose tweet is older than the retention are deleted by a nightly job, in batches that each commit on
# their own. The retention must be positive and the batch size at least 1, or the app refuses to start. The cron
# is shrunk to "-" (never) in application-test.properties
app.feed.retention=${FEED_RETENTION:7d}
app.feed.cleanup.cron=${FEED_CLEANUP_CRON:0 0 4 * * *}
app.feed.cleanup.zone=${FEED_CLEANUP_ZONE:Europe/Sofia}
app.feed.cleanup.batch-size=${FEED_CLEANUP_BATCH_SIZE:10000}

# ==============================================================================
# Feed back-fill
# ==============================================================================
# On a follow, the followee's newest tweets of the retention window before the follow are put into the
# follower's feed, at most this many. Must be positive, or the app refuses to start
app.feed.backfill-size=${FEED_BACKFILL_SIZE:50}

# ==============================================================================
# Actuator
# ==============================================================================
management.endpoints.web.exposure.include=health

# ==============================================================================
# Logging
# ==============================================================================
# Kafka clients are extremely chatty at INFO (full consumer config dump, coordinator discovery, Metadata
# cluster id). WARN keeps rebalance/coordinator warnings and errors while silencing the startup and
# steady-state noise; the app itself stays at INFO
logging.level.org.apache.kafka=WARN
logging.level.org.springframework.kafka=WARN
logging.level.kafka=WARN
