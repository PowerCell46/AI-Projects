# Same Kafka quieting as main (see application.properties) - keeps suite output readable.
logging.level.org.apache.kafka=WARN
logging.level.org.springframework.kafka=WARN
logging.level.kafka=WARN

# Never let the outbox poller drain messages mid-suite - tests assert on outbox messages right after acting
# and call the publisher directly.
app.outbox.poll-fixed-delay-ms=86400000

# Fixed, non-secret key for the test suite only - real environments must set INTERNAL_API_SECRET.
app.internal-api.secret=test-only-internal-api-secret-do-not-use-in-prod

# Short enough that a delayed stub trips it in a second or two rather than five.
spring.http.clients.read-timeout=1s
