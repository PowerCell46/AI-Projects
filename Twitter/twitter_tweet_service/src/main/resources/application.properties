# ==============================================================================
# App
# ==============================================================================
spring.application.name=twitter_tweet_service
server.port=${SERVER_PORT:8081}
# A SIGTERM lets running requests finish instead of cutting them off; Docker's stop_grace_period must outlast the timeout
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s
# Without this the scheduler interrupts a running job (the outbox publisher) on shutdown
spring.task.scheduling.shutdown.await-termination=true

# ==============================================================================
# Mongo
# ==============================================================================
# A single-node replica set (see the root docker-compose.yml), because multi-document transactions need one.
# directConnection skips replica-set host discovery, which would hand the host machine the container's
# internal address; transactions still work against the primary
spring.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/twitter_tweet_service_db?directConnection=true}

# UUIDs are stored as standard binary (subtype 4), readable by every driver
spring.mongodb.representation.uuid=standard

# No schema tool: the indexes the documents declare (e.g. the outbox's) are created on startup
spring.data.mongodb.auto-index-creation=true

# ==============================================================================
# Request limits
# ==============================================================================
# Cap on the raw request body, enforced by RequestBodySizeLimitFilter before any JSON parsing
app.request.max-body-bytes=${MAX_REQUEST_BODY_BYTES:8192}

# POST /api/v1/tweets gets its own, larger body cap: 4 images of 5 MB plus 64 KB of multipart framing.
# Spring's multipart limits below are derived from these so the three never drift apart
app.upload.max-file-bytes=${MAX_UPLOAD_FILE_BYTES:5242880}
app.upload.max-files=${MAX_UPLOAD_FILES:4}
app.request.max-tweet-body-bytes=${MAX_TWEET_BODY_BYTES:21037056}
spring.servlet.multipart.max-file-size=${app.upload.max-file-bytes}B
spring.servlet.multipart.max-request-size=${app.request.max-tweet-body-bytes}B

# ==============================================================================
# Tweets
# ==============================================================================
# Counted in Unicode code points, so an emoji is one character
app.tweets.max-content-code-points=${MAX_TWEET_CONTENT_CODE_POINTS:280}

# ==============================================================================
# MinIO
# ==============================================================================
# One private bucket for tweet images, created on startup if missing. The keys have no default - the app
# refuses to start without them. The bucket env name differs from the gateway's MINIO_BUCKET because both
# services read the same root .env
app.minio.url=${MINIO_URL:http://localhost:9000}
app.minio.access-key=${MINIO_ACCESS_KEY}
app.minio.secret-key=${MINIO_SECRET_KEY}
app.minio.bucket=${TWEET_MINIO_BUCKET:tweet-images}
# A stalled MinIO would otherwise pin request threads for the library default of 5 minutes
app.minio.connect-timeout=${MINIO_CONNECT_TIMEOUT:2s}
app.minio.io-timeout=${MINIO_IO_TIMEOUT:30s}

# ==============================================================================
# Downstream services
# ==============================================================================
# The gateway's /internal/v1/users, which names the authors of replies. The secret has no default anywhere -
# INTERNAL_API_SECRET must be set, 32+ bytes, or the app refuses to start, and it must equal the gateway's
app.gateway-internal.url=${GATEWAY_INTERNAL_URL:http://localhost:8080}
app.internal-api.secret=${INTERNAL_API_SECRET}

# Timeouts of every downstream call (Boot's global HTTP client settings). They stay under the gateway's 10s read
# timeout for proxied routes, so a slow gateway answers 504 here before the caller's gateway gives up. A connect
# failure answers 502, a read timeout 504; nothing is retried
spring.http.clients.connect-timeout=2s
spring.http.clients.read-timeout=5s

# ==============================================================================
# Outbox
# ==============================================================================
# Poller draining PENDING outbox messages to Kafka - fixed-delay, not cron, since it's a continuous drain. When Kafka
# does not take a message the batch stops and the message stays PENDING with no attempt counted, so an outage of any
# length loses nothing. Only a message Kafka refuses for its own content (too large, invalid topic) counts an attempt;
# at max-attempts it flips to FAILED, is never retried on its own and turns the health status to DEGRADED
app.outbox.poll-fixed-delay-ms=${OUTBOX_POLL_FIXED_DELAY_MS:3000}
app.outbox.batch-size=${OUTBOX_BATCH_SIZE:500}
app.outbox.max-attempts=${OUTBOX_MAX_ATTEMPTS:3}
app.outbox.send-timeout=${OUTBOX_SEND_TIMEOUT:10s}

# ==============================================================================
# Kafka: producer
# ==============================================================================
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9094}

# The outbox stores the event as a JSON string, so the value is a plain String (which also means no type
# headers). all-ack + idempotent so an at-least-once retry never duplicates a partition's offset ordering
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true
# A send has to fail on its own before app.outbox.send-timeout gives up on it, or a record the poller abandoned could
# still be delivered later and then again once its message is retried. The metadata wait is capped too: the default
# blocks send() for a minute per message while the broker is down. delivery.timeout.ms must be at least request.timeout.ms
spring.kafka.producer.properties.max.block.ms=5000
spring.kafka.producer.properties.request.timeout.ms=5000
spring.kafka.producer.properties.delivery.timeout.ms=8000

# ==============================================================================
# Kafka: topics
# ==============================================================================
# Keyed by tweet id, so one tweet's events stay in order within a partition
app.kafka.tweet-created.name=${TWEET_CREATED_TOPIC_NAME:tweet.created}
app.kafka.tweet-created.partitions=${TWEET_CREATED_TOPIC_PARTITIONS:3}
app.kafka.tweet-deleted.name=${TWEET_DELETED_TOPIC_NAME:tweet.deleted}
app.kafka.tweet-deleted.partitions=${TWEET_DELETED_TOPIC_PARTITIONS:3}

# ==============================================================================
# Actuator
# ==============================================================================
# The outbox indicator reports DEGRADED while messages are FAILED. A status missing from this list is ignored when
# the overall status is worked out, so it has to be here. It still answers HTTP 200, so the container health check passes
management.endpoint.health.status.order=DOWN,OUT_OF_SERVICE,DEGRADED,UP,UNKNOWN

# ==============================================================================
# Logging
# ==============================================================================
# Kafka clients are extremely chatty at INFO (full producer config dump, Metadata cluster id). WARN keeps
# coordinator warnings and errors while silencing the startup/steady-state noise; the app itself stays at INFO
logging.level.org.apache.kafka=WARN
logging.level.org.springframework.kafka=WARN
logging.level.kafka=WARN
