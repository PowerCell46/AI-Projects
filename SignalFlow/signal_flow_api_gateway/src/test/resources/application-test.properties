# Fixed, non-secret HS256 key for the test suite only - real environments must set JWT_SECRET.
app.jwt.secret=test-only-jwt-signing-secret-do-not-use-in-prod

# Skip the ~250ms/hash BCrypt cost in e2e registration/login tests.
app.security.bcrypt-strength=4

# A low cap so the e2e limit scenario fills it in a handful of requests instead of 100.
app.subscriptions.max-per-user=3

# Short enough that the 504 scenario's delayed stub trips it in a few seconds rather than ten.
spring.http.clients.read-timeout=1s

# Never fire the reconciliation job mid-suite; its tests call the service directly.
app.subscriptions.reconciliation.cron=-

# Never let the outbox poller drain rows mid-suite - TopicNewsListenerIntegrationTest asserts on
# notification_outbox rows right after the listener writes them, and a live poller could publish and
# delete them first. Its own tests call the service directly.
app.notification-outbox.poll-fixed-delay-ms=86400000

# Never fire the inbox cleanup job mid-suite, same reasoning as reconciliation's cron above.
app.notification-inbox.cleanup-cron=-

# Same Kafka quieting as main (see application.properties) - keeps suite output readable.
logging.level.org.apache.kafka=WARN
logging.level.org.springframework.kafka=WARN
logging.level.kafka=WARN
