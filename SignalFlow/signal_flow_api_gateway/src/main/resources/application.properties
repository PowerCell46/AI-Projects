spring.application.name=signal_flow_api_gateway

# Postgres - source of truth
spring.datasource.url=${DATASOURCE_URL:jdbc:postgresql://localhost:5432/signal_flow}
spring.datasource.username=${DATASOURCE_USERNAME:signal_flow}
spring.datasource.password=${DATASOURCE_PASSWORD:signal_flow}

# No Flyway this phase - uniqueness/indexes are declared on the entities themselves (see DECISIONS.md)
spring.jpa.hibernate.ddl-auto=update

# JWT signing secret and access-token TTL. No default anywhere - JWT_SECRET must be set in the
# environment or the app refuses to start (see DECISIONS.md)
app.jwt.secret=${JWT_SECRET}
app.jwt.ttl=${JWT_TTL:1h}

# Secure cookie attribute - false locally (Caddy is plain HTTP there), true in prod
app.cookie.secure=${COOKIE_SECURE:false}

# BCrypt strength - dropped in the test profile so e2e user registration doesn't pay ~250ms/hash
app.security.bcrypt-strength=${BCRYPT_STRENGTH:12}

# Cap on how many interest topics one user may subscribe to - bounds the rows an authenticated user
# can create; topic ids are only checked by the daily reconciliation job below
app.subscriptions.max-per-user=${MAX_SUBSCRIPTIONS_PER_USER:100}

# Daily job hard-deleting subscriptions whose interest topic no longer (or never did) exist. The zone is
# explicit so moving the container doesn't move the run. 200 ids per existence lookup keeps each request
# under the topic service's 8 KB body cap for internal routes
app.subscriptions.reconciliation.cron=${SUBSCRIPTION_RECONCILIATION_CRON:0 0 5 * * *}
app.subscriptions.reconciliation.zone=${SUBSCRIPTION_RECONCILIATION_ZONE:Europe/Sofia}
app.subscriptions.reconciliation.batch-size=${SUBSCRIPTION_RECONCILIATION_BATCH_SIZE:200}

# Cap on the raw request body, enforced by RequestBodySizeLimitFilter before authentication or JSON
# parsing. 8 KB leaves generous headroom over the largest legitimate body (register: a 254-character
# email plus a 72-character password)
app.request.max-body-bytes=${MAX_REQUEST_BODY_BYTES:8192}

# The same cap for the forwarded topic routes, whose downstream limits are counted in characters: a
# 4000-char prompt + 1000-char description + 100-char name, each char JSON-escaped as \uXXXX (6 bytes, the
# worst case), is ~30.6 KB
app.request.max-topic-body-bytes=${MAX_TOPIC_REQUEST_BODY_BYTES:32768}

# Optional initial admin, seeded once by DatabaseLoader if no admin exists yet. Unset (the default)
# skips seeding entirely.
app.admin.email=${ADMIN_EMAIL:}
app.admin.password=${ADMIN_PASSWORD:}

# Base URL of signal_flow_interest_topic_service - the target of the /api/v1/categories/** and
# /api/v1/interest-topics/** routes
app.interest-topic-service.url=${INTEREST_TOPIC_SERVICE_URL:http://localhost:8081}

# Upstream timeouts. Boot's global HTTP client settings, which gateway-webmvc's proxy picks up - it has no
# timeout keys of its own. Connect failures answer 502, read timeouts 504; nothing is retried
spring.http.clients.connect-timeout=${INTEREST_TOPIC_CONNECT_TIMEOUT:2s}
spring.http.clients.read-timeout=${INTEREST_TOPIC_READ_TIMEOUT:10s}

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9094}

# Fan-out producer - one topic-news.notification-requested send per enabled subscriber, mirroring the
# topic service's own outbox producer: all-ack + idempotent so an at-least-once retry never duplicates a
# partition's offset ordering, no type-info headers since the payload is a plain JSON contract
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JacksonJsonSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.properties.spring.json.add.type.headers=false

# Fan-out consumer - one record per topic-news.generated triggers one notification-requested send per
# enabled subscriber of that record's interest topic. earliest so nothing is missed on first start;
# concurrency matches the inbound topic's partition count, applied to KafkaConsumerConfiguration's factory
# via ConcurrentKafkaListenerContainerFactoryConfigurer. The value deserializer itself (ErrorHandlingDeserializer
# wrapping a JacksonJsonDeserializer bound to TopicNewsEventDTO) is built in that same Java config, not here -
# type headers are off, so there is no header for a properties-only deserializer to infer the target type from
spring.kafka.consumer.group-id=signal-flow-api-gateway
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.listener.concurrency=${TOPIC_NEWS_LISTENER_CONCURRENCY:3}

app.kafka.topic-news.name=topic-news.generated
app.kafka.notification-requested.name=${NOTIFICATION_REQUESTED_TOPIC_NAME:topic-news.notification-requested}
app.kafka.notification-requested.partitions=${NOTIFICATION_REQUESTED_TOPIC_PARTITIONS:3}

# Keyset batch size for loading one topic's enabled subscribers (id + email only) before fan-out sends
app.subscriptions.notification-fanout.batch-size=${NOTIFICATION_FANOUT_BATCH_SIZE:500}
