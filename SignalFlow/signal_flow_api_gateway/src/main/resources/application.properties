spring.application.name=signal_flow_api_gateway

# Postgres - source of truth
spring.datasource.url=${DATASOURCE_URL:jdbc:postgresql://localhost:5432/signal_flow}
spring.datasource.username=${DATASOURCE_USERNAME:signal_flow}
spring.datasource.password=${DATASOURCE_PASSWORD:signal_flow}

# No Flyway this phase - uniqueness/indexes are declared on the entities themselves (see DECISIONS.md)
spring.jpa.hibernate.ddl-auto=update

# JWT signing secret and access-token TTL. No default anywhere - JWT_SECRET must be set in the
# environment or the app refuses to start (see DECISIONS.md)
app.jwt.secret=${JWT_SECRET}
app.jwt.ttl=${JWT_TTL:1h}

# Secure cookie attribute - false locally (Caddy is plain HTTP there), true in prod
app.cookie.secure=${COOKIE_SECURE:false}

# BCrypt strength - dropped in the test profile so e2e user registration doesn't pay ~250ms/hash
app.security.bcrypt-strength=${BCRYPT_STRENGTH:12}

# Optional initial admin, seeded once by DatabaseLoader if no admin exists yet. Unset (the default)
# skips seeding entirely.
app.admin.email=${ADMIN_EMAIL:}
app.admin.password=${ADMIN_PASSWORD:}
