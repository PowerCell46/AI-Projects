spring.application.name=signal_flow_interest_topic_service

server.port=${PORT:8081}

# Caps the raw request body before Jackson parses it - a @Size constraint only rejects an oversized
# field after the whole body is already in memory
app.request.max-body-bytes=${MAX_REQUEST_BODY_BYTES:8192}

# The same cap for the topic and category routes, matching the gateway's: a 4000-char prompt + 1000-char
# description + 100-char name, each char JSON-escaped as \uXXXX (6 bytes, the worst case), is ~30.6 KB.
# The internal routes keep the 8 KB default above
app.request.max-topic-body-bytes=${MAX_TOPIC_REQUEST_BODY_BYTES:32768}

# Postgres - source of truth
spring.datasource.url=${DATASOURCE_URL:jdbc:postgresql://localhost:5432/signal_flow_topics}
spring.datasource.username=${DATASOURCE_USERNAME:signal_flow_topics}
spring.datasource.password=${DATASOURCE_PASSWORD:signal_flow_topics}

# No Flyway this phase - uniqueness/indexes are declared on the entities themselves
spring.jpa.hibernate.ddl-auto=update

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9094}

# Outbox producer - Jackson 3 value serializer, all-ack + idempotent so the outbox's at-least-once
# retries never duplicate a partition's offset ordering; type-info headers are off since the payload
# is a plain, language-agnostic JSON contract, not a Java-only one
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JacksonJsonSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.properties.spring.json.add.type.headers=false

app.outbox.poll-interval=PT10S
app.outbox.batch-size=50
app.outbox.max-attempts=5
app.outbox.base-backoff=PT1M

app.kafka.topic-news.name=topic-news.generated
app.kafka.topic-news.partitions=3

# GET /interest-topics - the controller's @PageableDefault sets size 20; this caps it at 100 regardless
# of what the caller requests. serialization-mode=via-dto is what switches the response envelope to
# {"content": [...], "page": {"size", "number", "totalElements", "totalPages"}} - the DIRECT default
# serializes PageImpl's raw fields (offset, pageable, sort, etc.) instead
spring.data.web.pageable.max-page-size=100
spring.data.web.pageable.serialization-mode=via-dto
