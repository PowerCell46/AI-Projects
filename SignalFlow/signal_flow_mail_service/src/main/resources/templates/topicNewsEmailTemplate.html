<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>{{TOPIC_NAME}}</title>
</head>
<body style="margin:0;padding:0;background-color:#f4f4f7;font-family:Arial, Helvetica, sans-serif;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#f4f4f7;padding:24px 0;">
    <tr>
        <td align="center">
            <table role="presentation" width="600" cellpadding="0" cellspacing="0" style="background-color:#ffffff;border-radius:8px;overflow:hidden;">
                <tr>
                    <td style="background-color:#1a1a2e;padding:24px 32px;">
                        <span style="color:#ffffff;font-size:20px;font-weight:bold;">SignalFlow</span>
                    </td>
                </tr>
                <tr>
                    <td style="padding:32px;">
                        <p style="margin:0 0 8px 0;color:#6b7280;font-size:13px;text-transform:uppercase;letter-spacing:0.05em;">{{CATEGORY_NAME}}</p>
                        <h1 style="margin:0 0 16px 0;color:#111827;font-size:22px;">{{TOPIC_NAME}}</h1>
                        <p style="margin:0 0 24px 0;color:#6b7280;font-size:13px;">News for {{NEWS_DATE}} &middot; generated {{GENERATED_AT}}</p>
                        <div style="color:#1f2937;font-size:15px;line-height:1.6;">
                            {{DATA}}
                        </div>
                    </td>
                </tr>
                <tr>
                    <td style="padding:24px 32px;background-color:#f9fafb;color:#9ca3af;font-size:12px;">
                        Sent to {{RECIPIENT_EMAIL}} because you're subscribed to this topic on SignalFlow.
                    </td>
                </tr>
            </table>
        </td>
    </tr>
</table>
</body>
</html>
