spring.application.name=signal_flow_mail_service
server.port=${SERVER_PORT:8082}

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9094}

# Fan-out consumer - one topic-news.notification-requested record per enabled subscriber, produced by
# signal_flow_api_gateway's NotificationOutboxPublisherServiceImpl. earliest so nothing is missed on
# first start; concurrency matches the topic's partition count. The value deserializer itself
# (ErrorHandlingDeserializer wrapping a JacksonJsonDeserializer bound to TopicNewsNotificationEventDTO) is
# built in KafkaConsumerConfiguration, not here - type headers are off on the producer side
spring.kafka.consumer.group-id=signal-flow-mail-service
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.listener.concurrency=${NOTIFICATION_REQUESTED_LISTENER_CONCURRENCY:3}

# The main topic is the gateway's own - not redeclared here. The DLT is declared by this service
# (KafkaTopicConfig) since this is its only consumer; the suffix is Spring Kafka 4's
# DeadLetterPublishingRecoverer default (verified in DECISIONS.md), pinned rather than left implicit.
app.kafka.notification-requested.name=${NOTIFICATION_REQUESTED_TOPIC_NAME:topic-news.notification-requested}
app.kafka.notification-requested.dlt-name=${NOTIFICATION_REQUESTED_DLT_NAME:topic-news.notification-requested-dlt}
app.kafka.notification-requested.dlt-partitions=${NOTIFICATION_REQUESTED_DLT_PARTITIONS:3}

# Blocking exponential backoff before a record is dead-lettered - every wait must stay under
# spring.kafka.consumer's default max.poll.interval.ms (5 min) with room to spare. Shrunk in
# application-test.properties so integration tests don't pay ~4 minutes per failure scenario.
app.kafka.retry.initial-interval-ms=${KAFKA_RETRY_INITIAL_INTERVAL_MS:2000}
app.kafka.retry.max-interval-ms=${KAFKA_RETRY_MAX_INTERVAL_MS:60000}
app.kafka.retry.max-retries=${KAFKA_RETRY_MAX_RETRIES:8}

# Redis inbox - StringRedisTemplate only, no repositories. Dedupes on (newsId, userId) so a Kafka
# redelivery never sends the same email twice, short of a crash between send and mark.
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

app.notification-inbox.claim-ttl-seconds=${NOTIFICATION_INBOX_CLAIM_TTL_SECONDS:300}
app.notification-inbox.sent-ttl-seconds=${NOTIFICATION_INBOX_SENT_TTL_SECONDS:604800}

# Gmail SMTP by default; overridable for local Mailpit (MAIL_HOST=localhost MAIL_PORT=1025
# MAIL_SMTP_AUTH=false MAIL_SMTP_STARTTLS=false). JavaMail's own timeouts default to infinite - a hung
# send must never outlive the claim TTL above, so all three are capped well under it.
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:true}
spring.mail.properties.mail.smtp.connectiontimeout=${MAIL_SMTP_CONNECTION_TIMEOUT_MS:10000}
spring.mail.properties.mail.smtp.timeout=${MAIL_SMTP_TIMEOUT_MS:10000}
spring.mail.properties.mail.smtp.writetimeout=${MAIL_SMTP_WRITE_TIMEOUT_MS:10000}

# No default - must be the Gmail account itself or a verified alias, since Gmail silently rewrites
# anything else. The app refuses to start without it, same precedent as the gateway's JWT secret.
app.mail.from=${MAIL_FROM}
app.mail.zone=${MAIL_ZONE:Europe/Sofia}

# health only - the SMTP probe (management.health.mail) is slow and must not gate liveness. The Redis
# indicator stays on the default enablement that spring-boot-starter-data-redis brings. show-details is
# safe here - no security starter, but also nothing but internal infra ever reaches this port.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=always
management.health.mail.enabled=false
