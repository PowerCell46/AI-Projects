# ==============================================================================
# App
# ==============================================================================
spring.application.name=signal_flow_mail_service
server.port=${SERVER_PORT:8082}

# ==============================================================================
# Kafka: consumer
# ==============================================================================
# Value deserializer is built in KafkaConsumerConfiguration (producer sends no type headers)
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9094}
spring.kafka.consumer.group-id=signal-flow-mail-service
spring.kafka.consumer.auto-offset-reset=earliest
# Matches the topic's partition count
spring.kafka.listener.concurrency=${NOTIFICATION_REQUESTED_LISTENER_CONCURRENCY:3}

# ==============================================================================
# Kafka: topics
# ==============================================================================
# Main topic is owned by the gateway; only the DLT is declared here (KafkaTopicConfig)
app.kafka.notification-requested.name=${NOTIFICATION_REQUESTED_TOPIC_NAME:topic-news.notification-requested}
app.kafka.notification-requested.dlt-name=${NOTIFICATION_REQUESTED_DLT_NAME:topic-news.notification-requested-dlt}
app.kafka.notification-requested.dlt-partitions=${NOTIFICATION_REQUESTED_DLT_PARTITIONS:3}

# ==============================================================================
# Kafka: retry before DLT
# ==============================================================================
# Each wait must stay well under max.poll.interval.ms (5 min). Shrunk in application-test.properties
app.kafka.retry.initial-interval-ms=${KAFKA_RETRY_INITIAL_INTERVAL_MS:2000}
app.kafka.retry.max-interval-ms=${KAFKA_RETRY_MAX_INTERVAL_MS:60000}
app.kafka.retry.max-retries=${KAFKA_RETRY_MAX_RETRIES:8}

# ==============================================================================
# Redis: notification inbox
# ==============================================================================
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
app.notification-inbox.claim-ttl-seconds=${NOTIFICATION_INBOX_CLAIM_TTL_SECONDS:300}
app.notification-inbox.sent-ttl-seconds=${NOTIFICATION_INBOX_SENT_TTL_SECONDS:604800}

# ==============================================================================
# Mail: SMTP
# ==============================================================================
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:true}
# JavaMail defaults to infinite; a hung send must never outlive the inbox claim TTL
spring.mail.properties.mail.smtp.connectiontimeout=${MAIL_SMTP_CONNECTION_TIMEOUT_MS:10000}
spring.mail.properties.mail.smtp.timeout=${MAIL_SMTP_TIMEOUT_MS:10000}
spring.mail.properties.mail.smtp.writetimeout=${MAIL_SMTP_WRITE_TIMEOUT_MS:10000}

# ==============================================================================
# Mail: content
# ==============================================================================
# Required, no default. Must be the Gmail account or a verified alias (Gmail rewrites anything else)
app.mail.from=${MAIL_FROM}
app.mail.zone=${MAIL_ZONE:Europe/Sofia}

# ==============================================================================
# Actuator
# ==============================================================================
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=always
# SMTP probe is slow and must not gate liveness
management.health.mail.enabled=false
