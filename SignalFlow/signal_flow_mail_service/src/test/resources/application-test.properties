# Shrunk from the production 2s->60s/8-retries backoff so a dead-lettered scenario finishes in ~1s
# rather than ~4 minutes. Still 3 retries so classification (permanent vs. transient) is exercised.
app.kafka.retry.initial-interval-ms=100
app.kafka.retry.max-interval-ms=200
app.kafka.retry.max-retries=3

# Fixed, non-secret sender for the test suite only - real environments must set MAIL_FROM.
app.mail.from=signalflow-test@example.com
